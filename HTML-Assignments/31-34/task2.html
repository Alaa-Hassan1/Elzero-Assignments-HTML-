<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form target="_blank" novalidate>
        <div>
            <label for="S">Search</label> <br><br>
            <input type="search" id="S" placeholder="Enter A Search Word" autofocus>
        </div>
        <br>
        <div>
            <label for="UL">Upload</label> <br><br>
            <input type="file" id="UL">
        </div>
        <br>
        <div>
            <label for="UR">Url</label>
            <input type="url" id="UR" required>
        </div>
        <br>
        <label for="date">Date</label>
        <input type="date" value="1982-10-25">
        <br><br>
        <label for="month">Month</label>
        <input type="month" value="1982-10">

        <br><br>
        <input type="reset" value="Empty">
        <input type="submit" value="Save">
    </form>
</body>
</html>
